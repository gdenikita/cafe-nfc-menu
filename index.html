<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Station One Cafe</title>
<meta name="theme-color" content="#ffffff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:light;--bg:#fff;--card:#fff;--text:#1a1a1a;--muted:#757575;--line:#e5e5e5;--pri:#1a1a1a;--onpri:#fff;--acc:#1a1a1a;--ok:#1a1a1a;--r:0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font:15px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;font-weight:400;padding-bottom:96px;letter-spacing:.01em}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;min-height:44px;background:none}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--bg);border-bottom:1px solid var(--line);padding:18px 20px 0}
.wrap{max-width:720px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
h1{font-size:1rem;font-weight:500;letter-spacing:.28em;text-transform:uppercase;color:var(--text)}
.sub{font-size:.7rem;color:var(--muted);margin-top:6px;font-weight:300;letter-spacing:.04em}
.cats{display:flex;gap:0;overflow-x:auto;margin-top:18px;scrollbar-width:none;padding-bottom:0;border-bottom:1px solid var(--line)}
.cats::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:12px 16px;border-radius:0;background:transparent;border:0;border-bottom:2px solid transparent;color:var(--muted);font-size:.75rem;font-weight:400;letter-spacing:.12em;text-transform:uppercase;margin-bottom:-1px}
.chip.on{background:transparent;color:var(--text);border-bottom-color:var(--text);font-weight:500}
.qwrap{max-width:720px;margin:0 auto;padding:16px 20px 0}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick .btn{padding:12px 6px;font-size:.68rem;line-height:1.2;min-height:44px;letter-spacing:.06em;text-transform:uppercase;font-weight:400}
#q{margin:14px 0 0;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:12px 0;background:transparent;font-size:.9rem;font-weight:300}
#q::placeholder{color:var(--muted);letter-spacing:.04em}
.menu{padding:8px 20px 24px;display:grid;gap:0;max-width:720px;margin:0 auto}
@media(min-width:640px){.menu{grid-template-columns:1fr 1fr;gap:0 32px}}
.item{background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;padding:20px 0;display:flex;gap:16px;transition:opacity .2s}
.item:hover{opacity:.75}
.ph{width:72px;height:72px;border-radius:0;background:#f5f5f5;flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:1.1rem;font-weight:300;color:var(--muted);letter-spacing:.05em}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.name{font-weight:400;font-size:.9rem;letter-spacing:.04em;text-transform:uppercase}
.desc{font-size:.78rem;color:var(--muted);margin:4px 0 10px;font-weight:300;line-height:1.4}
.row{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-weight:400;color:var(--text);font-size:.85rem;letter-spacing:.03em}
.btn{background:var(--pri);color:var(--onpri);border-radius:0;padding:0 20px;font-weight:400;font-size:.75rem;letter-spacing:.14em;text-transform:uppercase;transition:opacity .2s}
.btn:hover{opacity:.85}
.btn.sec{background:transparent;color:var(--text);border:1px solid var(--text)}
.btn.acc{background:var(--acc);color:#fff}
.btn.sm{min-height:36px;padding:0 14px;font-size:.7rem}
.qty{display:flex;align-items:center;gap:12px}
.qty button{width:32px;min-height:32px;border-radius:0;background:transparent;border:1px solid var(--line);font-size:.9rem;color:var(--text)}
.qty b{font-weight:400;min-width:16px;text-align:center}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:60;max-width:100%;margin:0 auto;padding:0;padding-bottom:env(safe-area-inset-bottom,0px);background:var(--text)}
.bar .btn{width:100%;min-height:56px;display:flex;justify-content:space-between;align-items:center;box-shadow:none;border-radius:0;padding:0 24px;background:var(--text);color:var(--onpri);font-size:.75rem;letter-spacing:.16em}
.bar.hide{display:none}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:100;display:none}
.shade.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:110;background:var(--bg);border-radius:0;max-height:92%;overflow-y:auto;padding:24px 20px calc(24px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .3s cubic-bezier(.2,.8,.2,1);max-width:720px;margin:0 auto;border-top:1px solid var(--line)}
.sheet.on{transform:none}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}
.sh h2{font-size:.85rem;font-weight:500;letter-spacing:.2em;text-transform:uppercase}
.x{background:none;font-size:1.2rem;width:44px;color:var(--muted);font-weight:300}
.ci{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:16px 0;border-bottom:1px solid var(--line)}
.ci b{font-weight:400;font-size:.85rem;letter-spacing:.03em}
.total{text-align:right;font-weight:400;font-size:1rem;margin:20px 0;letter-spacing:.06em}
input,textarea,select{width:100%;padding:14px 0;margin-bottom:4px;background:transparent;border:0;border-bottom:1px solid var(--line);border-radius:0;font-size:16px;font-weight:300}
input:focus,textarea:focus{outline:0;border-bottom-color:var(--text)}
label{display:block;font-size:.65rem;color:var(--muted);margin:14px 0 0;letter-spacing:.12em;text-transform:uppercase;font-weight:400}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{font-size:.8rem;color:var(--muted);margin:8px 0;font-weight:300}
.ok{text-align:center;padding:40px 0}
.ok b{display:block;font-size:2rem;color:var(--text);font-weight:300;margin-bottom:12px}
.ok h2{font-size:.9rem;letter-spacing:.16em;text-transform:uppercase;font-weight:500}
.foot{text-align:center;padding:32px 20px;font-size:.7rem}
.foot button{background:none;color:var(--muted);text-decoration:none;min-height:36px;letter-spacing:.1em;text-transform:uppercase;font-size:.65rem}
.adm{padding:14px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.hidden{display:none!important}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;min-height:44px;text-align:center}
button:disabled{opacity:.4;cursor:not-allowed}
.payv{display:grid;gap:10px;margin-top:16px}
.payv .btn{min-height:52px}
.toast{position:fixed;left:50%;bottom:calc(80px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--text);color:var(--onpri);padding:12px 20px;border-radius:0;z-index:300;font-size:.75rem;max-width:90%;text-align:center;letter-spacing:.08em;text-transform:uppercase}
.irow{padding:12px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.irow span:first-child{color:var(--muted);font-size:.75rem;letter-spacing:.06em;text-transform:uppercase}
.ih{font-weight:500;margin:24px 0 12px;font-size:.75rem;letter-spacing:.16em;text-transform:uppercase}
.stop{opacity:.4}
.tags{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.tag{padding:6px 12px;border-radius:0;border:1px solid var(--line);font-size:.65rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:300}
#tableBadge{border:1px solid var(--text)!important;background:transparent!important;color:var(--text)!important;border-radius:0!important;font-size:.65rem!important;letter-spacing:.1em;text-transform:uppercase;font-weight:400;padding:0 10px!important}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><div><h1 id="cafe"></h1><div class="sub" id="sub"></div></div><span class="msg" id="mode"></span><span class="chip on" id="tableBadge" style="display:none;min-height:30px;line-height:30px"></span></div>
  <div class="cats" id="cats"></div>
</div></header>
<div class="qwrap">
  <div class="quick">
    <button class="btn sec" id="qCall">Позвать официанта</button>
    <button class="btn sec" id="qBill">Попросить счёт</button>
    <button class="btn sec" id="qInfo">Отзывы и адрес</button>
  </div>
  <input id="q" type="search" placeholder="Поиск по меню">
</div>
<main class="menu" id="menu"></main>
<div class="foot"><button id="admBtn">Вход для администратора</button></div>
<div class="bar hide" id="bar"><button class="btn" id="openCart"><span id="barCnt"></span><span id="barSum"></span></button></div>
<div class="shade" id="shade"></div>
<section class="sheet" id="cartSheet">
  <div class="sh"><h2>Ваш заказ</h2><button class="x" data-close>✕</button></div>
  <div id="cartView">
    <div id="cartItems"></div>
    <div class="total" id="cartTotal"></div>
    <label>Номер стола</label><input id="cTable" inputmode="numeric" maxlength="10" placeholder="Например, 5">
    <label>Имя</label><input id="cName" autocomplete="name">
    <label>Телефон</label><input id="cPhone" type="tel" autocomplete="tel" inputmode="tel">
    <label>Комментарий</label><textarea id="cNote" rows="2"></textarea>
    <div class="payv">
      <button class="btn" id="payCash">Оплатить наличными</button>
      <button class="btn sec" id="payTerminal">Оплатить через терминал</button>
    </div>
    <div class="msg" id="payMsg"></div>
  </div>
  <div class="ok hidden" id="okView"><b>✓</b><h2>Заказ принят</h2><p id="okText"></p><p class="msg" id="okId"></p>
    <button class="btn" style="margin-top:14px" id="newOrder">Новый заказ</button></div>
</section>
<section class="sheet" id="infoSheet">
  <div class="sh"><h2>О нас</h2><button class="x" data-close>✕</button></div>
  <div id="infoBody"></div>
</section>
<section class="sheet" id="admSheet">
  <div class="sh"><h2>Администратор</h2><button class="x" data-close>✕</button></div>
  <div id="admLogin">
    <label>Пароль</label><input id="admPass" type="password" autocomplete="off">
    <button class="btn" id="admGo" style="width:100%">Войти</button>
    <div class="msg" id="admErr"></div>
  </div>
  <div id="admMain" class="hidden">
    <label>Название заведения</label><input id="admName">
    <div class="sh"><b>Блюда</b><button class="btn sm" id="addDish">+ Добавить</button></div>
    <div id="admList"></div>
    <div id="admForm" class="hidden" style="margin-top:12px">
      <label>Название</label><input id="fName">
      <label>Описание</label><input id="fDesc">
      <label>Категория</label><input id="fCat">
      <label>Цена, BYN</label><input id="fPrice" type="number" step="0.01" inputmode="decimal">
      <label>Ссылка на фото (необязательно)</label><input id="fImg" inputmode="url">
      <label style="display:flex;align-items:center;gap:8px;font-size:.95rem;color:var(--text);margin-bottom:12px;text-transform:none;letter-spacing:0"><input type="checkbox" id="fStop" style="width:auto;margin:0"> Нет в наличии</label>
      <div class="pay"><button class="btn" id="fSave">Сохранить</button><button class="btn sec" id="fCancel">Отмена</button></div>
    </div>
    <button class="btn" id="pubMenu" style="width:100%;margin-top:14px">Сохранить меню на сервере</button>
    <div class="pay" style="margin-top:10px">
      <button class="btn sec sm" id="expJson">Копировать JSON</button>
      <button class="btn sec sm" id="impJson">Вставить JSON</button>
    </div>
    <div class="msg" id="admMsg"></div>
    <button class="btn sec sm" id="admOut" style="margin-top:8px">Выйти</button>
  </div>
</section>
<script src="app.js"></script>
</body>
</html>
