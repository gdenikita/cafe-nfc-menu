<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Station One Cafe</title>
<meta name="theme-color" content="#0e0e10">
<style>
:root{color-scheme:dark;
  /* ФИРМЕННЫЕ ЦВЕТА: меняются здесь */
  --bg:#0e0e10;--card:#18181b;--text:#f3efe8;--muted:#9a948a;--line:#2b2b30;
  --pri:#d9a441;--onpri:#141414;--acc:#d9a441;--ok:#4cb89a;--r:14px;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--text);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;padding-bottom:96px}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;min-height:44px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}
.wrap{max-width:720px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:1.1rem;letter-spacing:.16em;text-transform:uppercase;color:var(--pri)}
.sub{font-size:.72rem;color:var(--muted);margin-top:2px;letter-spacing:.03em}
header{border-bottom:1px solid var(--pri)!important}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 4px}
.tag{padding:4px 12px;border-radius:20px;border:1px solid var(--line);font-size:.8rem;color:var(--muted)}
.btn.acc{background:var(--acc);color:var(--onpri)}
.ph{color:var(--pri)}
.cats{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none;padding-bottom:2px}
.cats::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:0 16px;border-radius:22px;background:var(--bg);border:1px solid var(--line);color:var(--text)}
.chip.on{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.menu{padding:14px 16px;display:grid;gap:12px;max-width:720px;margin:0 auto}
@media(min-width:640px){.menu{grid-template-columns:1fr 1fr}}
.item{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;gap:12px}
.ph{width:88px;height:88px;border-radius:10px;background:var(--bg);flex:none;object-fit:cover;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:var(--muted)}
.info{flex:1;min-width:0;display:flex;flex-direction:column}
.name{font-weight:600}
.desc{font-size:.85rem;color:var(--muted);margin:2px 0 6px}
.row{margin-top:auto;display:flex;justify-content:space-between;align-items:center;gap:8px}
.price{font-weight:700;color:var(--acc)}
.btn{background:var(--pri);color:var(--onpri);border-radius:10px;padding:0 16px;font-weight:600}
.btn.sec{background:var(--bg);color:var(--text);border:1px solid var(--line)}
.btn.acc{background:var(--acc);color:#fff}
.btn.sm{min-height:36px;padding:0 12px;font-size:.85rem}
.qty{display:flex;align-items:center;gap:10px}
.qty button{width:36px;min-height:36px;border-radius:50%;background:var(--bg);border:1px solid var(--line)}
.bar{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom,0px));z-index:60;max-width:696px;margin:0 auto}
.bar .btn{width:100%;min-height:52px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 6px 20px rgba(0,0,0,.25);border-radius:16px}
.bar.hide{display:none}
.shade{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;display:none}
.shade.on{display:block}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:110;background:var(--card);border-radius:20px 20px 0 0;max-height:90%;overflow-y:auto;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .25s;max-width:720px;margin:0 auto}
.sheet.on{transform:none}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.x{background:none;font-size:1.4rem;width:44px}
.ci{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.total{text-align:right;font-weight:700;font-size:1.15rem;margin:12px 0}
input,textarea,select{width:100%;padding:12px;margin-bottom:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;font-size:16px}
label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:3px}
.pay{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.msg{font-size:.85rem;color:var(--muted);margin:8px 0}
.ok{text-align:center;padding:24px 0}
.ok b{display:block;font-size:2.4rem;color:var(--ok)}
.foot{text-align:center;padding:20px;font-size:.8rem}
.foot button{background:none;color:var(--muted);text-decoration:underline;min-height:36px}
.adm{padding:10px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:8px}
.hidden{display:none!important}
a.btn{display:flex;align-items:center;justify-content:center;text-decoration:none;min-height:44px;text-align:center}
button:disabled{opacity:.5;cursor:not-allowed}
.payv{display:grid;gap:10px}.payv .btn{min-height:50px}.payv small{font-weight:400;opacity:.85}
.qwrap{max-width:720px;margin:0 auto;padding:12px 16px 0}
.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.quick .btn{padding:0 6px;font-size:.78rem;line-height:1.15;min-height:46px}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--pri);color:var(--onpri);padding:10px 16px;border-radius:12px;z-index:300;font-size:.9rem;max-width:90%;text-align:center}
.irow{padding:8px 0;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:center}
.irow span:first-child{color:var(--muted);font-size:.85rem}
.ih{font-weight:700;margin:16px 0 8px}
.stop{opacity:.55}
</style>
</head>
<body>
<header><div class="wrap">
  <div class="top"><div><h1 id="cafe"></h1><div class="sub" id="sub"></div></div><span class="msg" id="mode"></span><span class="chip on" id="tableBadge" style="display:none;min-height:30px;line-height:30px"></span></div>
  <div class="cats" id="cats"></div>
</div></header>
<div class="qwrap">
  <div class="quick">
    <button class="btn sec" id="qCall">Позвать официанта</button>
    <button class="btn sec" id="qBill">Попросить счёт</button>
    <button class="btn sec" id="qInfo">Отзывы и адрес</button>
  </div>
  <input id="q" type="search" placeholder="Поиск по меню" style="margin:10px 0 0">
</div>
<main class="menu" id="menu"></main>
<div class="foot"><button id="admBtn">Вход для администратора</button></div>

<div class="bar hide" id="bar"><button class="btn" id="openCart"><span id="barCnt"></span><span id="barSum"></span></button></div>
<div class="shade" id="shade"></div>

<!-- Корзина -->
<section class="sheet" id="cartSheet">
  <div class="sh"><h2>Ваш заказ</h2><button class="x" data-close>✕</button></div>
  <div id="cartView">
    <div id="cartItems"></div>
    <div class="total" id="cartTotal"></div>
    <label>Номер стола</label><input id="cTable" inputmode="numeric" maxlength="10" placeholder="Например, 5">
    <label>Имя</label><input id="cName" autocomplete="name">
    <label>Телефон</label><input id="cPhone" type="tel" autocomplete="tel" inputmode="tel">
    <label>Комментарий</label><textarea id="cNote" rows="2"></textarea>
    <div class="payv">
      <button class="btn" id="payCash">Оплатить наличными</button>
      <button class="btn sec" id="payTerminal">Оплатить через терминал</button>
    </div>
    <div class="msg" id="payMsg"></div>
  </div>
  <div class="ok hidden" id="okView"><b>✓</b><h2>Заказ принят</h2><p id="okText"></p><p class="msg" id="okId"></p>
    <button class="btn" style="margin-top:14px" id="newOrder">Новый заказ</button></div>
</section>

<!-- Информация, карты, отзывы -->
<section class="sheet" id="infoSheet">
  <div class="sh"><h2>О нас</h2><button class="x" data-close>✕</button></div>
  <div id="infoBody"></div>
</section>

<!-- Админка -->
<section class="sheet" id="admSheet">
  <div class="sh"><h2>Администратор</h2><button class="x" data-close>✕</button></div>
  <div id="admLogin">
    <label>Пароль</label><input id="admPass" type="password" autocomplete="off">
    <button class="btn" id="admGo" style="width:100%">Войти</button>
    <div class="msg" id="admErr"></div>
  </div>
  <div id="admMain" class="hidden">
    <label>Название заведения</label><input id="admName">
    <div class="sh"><b>Блюда</b><button class="btn sm" id="addDish">+ Добавить</button></div>
    <div id="admList"></div>
    <div id="admForm" class="hidden" style="margin-top:12px">
      <label>Название</label><input id="fName">
      <label>Описание</label><input id="fDesc">
      <label>Категория</label><input id="fCat">
      <label>Цена, BYN</label><input id="fPrice" type="number" step="0.01" inputmode="decimal">
      <label>Ссылка на фото (необязательно)</label><input id="fImg" inputmode="url">
      <label style="display:flex;align-items:center;gap:8px;font-size:.95rem;color:var(--text);margin-bottom:12px"><input type="checkbox" id="fStop" style="width:auto;margin:0"> Нет в наличии (стоп-лист)</label>
      <div class="pay"><button class="btn" id="fSave">Сохранить</button><button class="btn sec" id="fCancel">Отмена</button></div>
    </div>
    <button class="btn" id="pubMenu" style="width:100%;margin-top:14px">Сохранить меню на сервере</button>
    <div class="pay" style="margin-top:10px">
      <button class="btn sec sm" id="expJson">Копировать JSON меню</button>
      <button class="btn sec sm" id="impJson">Вставить JSON меню</button>
    </div>
    <div class="msg" id="admMsg"></div>
    <button class="btn sec sm" id="admOut" style="margin-top:8px">Выйти</button>
  </div>
</section>

<script>
/* ============ НАСТРОЙКИ ============ */
const CONFIG = {
  cafeName: "Station One Cafe",
  currency: "BYN",
  // Данные заведения. Пустые поля просто не показываются. Заполните и закоммитьте.
  place: {
    address: "Гомель, Советская улица, 29А (2 этаж)",          // например "г. Гомель, ул. Советская, 10"
    phone: "+375 33 333-52-33",            // например "+375 29 000-00-00"
    hours: "",            // например "Ежедневно 10:00-23:00"
    lat: 52.434714, lng: 31.009511, // координаты (правый клик по карте -> скопировать), например 52.4345 и 30.9754
    wifiName: "", wifiPass: "",
    yandexOrg: "https://yandex.by/maps/org/station_one_cafe/112602723149/",        // ссылка на организацию в Яндекс Картах (https://yandex.by/maps/org/.../ID/)
    googleMaps: "",       // ссылка "Поделиться" из Google Карт
    googlePlaceId: "",    // Place ID для кнопки "Оставить отзыв" в Google
    tags: ["Кальян", "Wi-Fi", "Летняя терраса", "Бизнес-ланч", "Детское меню", "Оплата картой", "Доставка", "С собой"],
    social: { instagram: "https://www.instagram.com/station_one_gomel/", vk: "https://vk.ru/cafestationone", facebook: "https://facebook.com/cafestationone" },
    gisUrl: ""            // ссылка на организацию в 2ГИС (https://2gis.by/gomel/firm/ID)
  },
  apiUrl: "https://cafe-nfc-menu-api.gde-nikita.workers.dev",                     // адрес Worker, например "https://cafe-nfc-menu-api.ИМЯ.workers.dev"
  demoAdminPassword: "1234",      // работает ТОЛЬКО если apiUrl пустой (демо-режим). С сервером пароль проверяет сервер.
  storageKey: "cafe_menu_v2"
};

/* ===== Интеграция bePaid (заготовка) =====
   Ключи магазина (shop_id / secret_key) НИКОГДА не кладём во фронтенд.
   Схема: фронтенд -> ваш сервер (endpoint) -> bePaid API -> redirect_url -> клиент платит.
   Деньги идут на счёт заведения, т.к. сервер использует его shop_id и secret_key.
   Сервер получает уведомление (notification_url) и подтверждает статус заказа. */
const PAYMENT = {
  provider: "bepaid",
  endpoint: "",                    // например "https://your-server.by/api/create-payment"
  async createCheckout(order){
    if(!this.endpoint) return {ok:false, reason:"not_configured"};
    const res = await fetch(this.endpoint,{
      method:"POST", headers:{"Content-Type":"application/json"},
      body:JSON.stringify({orderId:order.id, amount:order.total, currency:CONFIG.currency,
        description:"Заказ "+order.id, items:order.items.map(i=>({id:i.id,qty:i.qty}))})
    });
    if(!res.ok) return {ok:false, reason:"server_error"};
    const data = await res.json();      // ожидается { redirect_url: "https://checkout.bepaid.by/..." }
    return data.redirect_url ? {ok:true, url:data.redirect_url} : {ok:false, reason:"no_url"};
  }
};

/* Отправка заказа на сервер -> Telegram-группа персонала */
const ORDERS = {
  async submit(order){
    if(!CONFIG.apiUrl){ console.log("ORDER (демо)", order); return {ok:true, id:order.id}; }
    try{
      const r = await fetch(CONFIG.apiUrl+"/order",{method:"POST",headers:{"Content-Type":"application/json"},
        body:JSON.stringify({table:order.table,type:order.type,name:order.name,phone:order.phone,comment:order.comment,
          items:order.items.map(i=>({id:i.id,name:i.name,price:i.price,qty:i.qty}))})});
      const d = await r.json();
      return r.ok && d.ok ? {ok:true,id:d.id} : {ok:false};
    }catch(e){ return {ok:false}; }
  }
};

/* ============ ДАННЫЕ ============ */
const DEFAULT_MENU = [
  {id:1,category:"Закуски",name:"Картофель фри",desc:"Хрустящий снаружи, мягкий внутри · 100 г",price:6,img:""},
  {id:2,category:"Закуски",name:"Мутабаль",desc:"Печёные баклажаны, кунжутная паста, оливковое масло · 185 г",price:19,img:""},
  {id:3,category:"Пицца",name:"Ветчина и грибы",desc:"Томатный соус, ветчина, грибы, моцарелла · 30 см, 460 г",price:19.5,img:""},
  {id:4,category:"Пицца",name:"Ди маре",desc:"Креветки, мидии, каперсы, маслины, черри, моцарелла · 510 г",price:26,img:""},
  {id:5,category:"Пицца",name:"Шаверма-пицца",desc:"Чесночный соус, курица, маринованные огурцы, томат, моцарелла · 490 г",price:19.5,img:""},
  {id:6,category:"Шаверма и сэндвичи",name:"Фалафель сэндвич",desc:"Фалафель, маринованный огурец, томаты, лук, тахини · 350 г",price:9.5,img:""},
  {id:7,category:"Шаверма и сэндвичи",name:"Шаверма говяжья",desc:"Говядина, огурцы, томаты, лук, тахини · 350 г",price:12.9,img:""},
  {id:8,category:"Шаверма и сэндвичи",name:"Шаверма куриная",desc:"Куриная грудка, огурцы, чесночный соус, картофель фри · 350 г",price:11.5,img:""},
  {id:9,category:"Горячее",name:"Барбекю из говядины",desc:"Говяжья вырезка, огурчик, лук, хумус · 340 г",price:39,img:""},
  {id:10,category:"Горячее",name:"Филадельфия",desc:"Куриное филе, грибы, болгарский перец, сыр, картофель фри · 370 г",price:25,img:""}
];
let state = {cafeName:CONFIG.cafeName, menu:DEFAULT_MENU};
try{ const s = JSON.parse(localStorage.getItem(CONFIG.storageKey)||"null"); if(s && Array.isArray(s.menu)) state = s; }catch(e){}
function save(){ try{ localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); }catch(e){} }

const TABLE = (new URLSearchParams(location.search).get("table")||"").replace(/[^0-9A-Za-zА-Яа-я-]/g,"").slice(0,10);
if(TABLE){ const b=document.getElementById("tableBadge"); b.textContent="Стол "+TABLE; b.style.display="inline-block"; }
let adminPass = "";
async function loadRemoteMenu(){
  if(!CONFIG.apiUrl) return;
  try{
    const r = await fetch(CONFIG.apiUrl+"/menu"); const d = await r.json();
    if(d && Array.isArray(d.menu)){ state = {cafeName:d.cafeName||CONFIG.cafeName, menu:d.menu}; cart=[]; renderCats(); refresh(); }
  }catch(e){ /* остаёмся на локальном меню */ }
}
async function pushRemoteMenu(){
  if(!CONFIG.apiUrl) return true;
  try{
    const r = await fetch(CONFIG.apiUrl+"/menu",{method:"PUT",headers:{"Content-Type":"application/json","X-Admin-Password":adminPass},body:JSON.stringify(state)});
    return r.ok;
  }catch(e){ return false; }
}
let cart = [], cat = "Все", isAdmin = false, editId = null;
const $ = id => document.getElementById(id);
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = n => n.toFixed(2)+" "+CONFIG.currency;

/* ============ МЕНЮ ============ */
function renderCats(){
  const cats = ["Все", ...new Set(state.menu.map(i=>i.category))];
  if(!cats.includes(cat)) cat = "Все";
  $("cats").innerHTML = cats.map(c=>`<button class="chip ${c===cat?"on":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("");
}
function thumb(i){
  const letter = esc((i.name||"?").trim().charAt(0).toUpperCase());
  return i.img ? `<img class="ph" src="${esc(i.img)}" alt="" loading="lazy" onerror="this.outerHTML='<div class=&quot;ph&quot;>${letter}</div>'">` : `<div class="ph">${letter}</div>`;
}
function renderMenu(){
  $("cafe").textContent = state.cafeName;
  $("sub").textContent = ((CONFIG.place.address||"").replace(/,?\s*\(.*\)/,"")).replace(/^г\.\s*/,"");
  document.title = state.cafeName;
  const term = ($("q")?$("q").value:"").trim().toLowerCase();
  let list = cat==="Все" ? state.menu : state.menu.filter(i=>i.category===cat);
  if(term) list = list.filter(i=>(i.name+" "+i.desc).toLowerCase().includes(term));
  $("menu").innerHTML = list.map(i=>{
    const q = (cart.find(c=>c.id===i.id)||{}).qty||0;
    const ctl = i.stop ? `<span class="msg">Нет в наличии</span>` : q ? `<div class="qty"><button data-dec="${i.id}">−</button><b>${q}</b><button data-inc="${i.id}">+</button></div>`
                  : `<button class="btn sm" data-inc="${i.id}">Добавить</button>`;
    return `<article class="item${i.stop?" stop":""}">${thumb(i)}<div class="info"><div class="name">${esc(i.name)}</div><div class="desc">${esc(i.desc)}</div><div class="row"><span class="price">${money(i.price)}</span>${ctl}</div></div></article>`;
  }).join("") || '<p class="msg">Меню пока пустое.</p>';
}

/* ============ КОРЗИНА ============ */
const total = () => cart.reduce((s,i)=>s+i.price*i.qty,0);
const count = () => cart.reduce((s,i)=>s+i.qty,0);
function change(id,d){
  const it = state.menu.find(m=>m.id===id); if(!it || (it.stop && d>0)) return;
  const ex = cart.find(c=>c.id===id);
  if(ex){ ex.qty += d; if(ex.qty<=0) cart = cart.filter(c=>c.id!==id); }
  else if(d>0) cart.push({...it,qty:1});
  refresh();
}
function refresh(){
  renderMenu();
  $("bar").classList.toggle("hide", count()===0);
  $("barCnt").textContent = "Корзина · "+count();
  $("barSum").textContent = money(total());
  $("cartItems").innerHTML = cart.map(i=>`<div class="ci"><div><b>${esc(i.name)}</b><div class="msg">${money(i.price)}</div></div>
    <div class="qty"><button data-dec="${i.id}">−</button><b>${i.qty}</b><button data-inc="${i.id}">+</button></div></div>`).join("");
  $("cartTotal").textContent = "Итого: "+money(total());
  if(!cart.length && $("cartSheet").classList.contains("on")) closeAll();
}
function openSheet(id){ $("shade").classList.add("on"); $(id).classList.add("on"); }
function closeAll(){ $("shade").classList.remove("on"); document.querySelectorAll(".sheet").forEach(s=>s.classList.remove("on")); }

async function placeOrder(type){
  if(!cart.length) return;
  const table = $("cTable").value.trim() || TABLE;
  if(!/^[0-9A-Za-zА-Яа-я-]{1,10}$/.test(table)){ $("payMsg").textContent="Укажите номер стола"; $("cTable").focus(); return; }
  const order = {id:"ORD-"+Date.now().toString().slice(-6), type, status:"new", table,
    name:$("cName").value.trim(), phone:$("cPhone").value.trim(), comment:$("cNote").value.trim(),
    items:cart.map(({id,name,price,qty})=>({id,name,price,qty})), total:+total().toFixed(2), createdAt:new Date().toISOString()};
  $("payMsg").textContent = "Отправляем...";
  let text = "";
  if(type==="online"){
    const pay = await PAYMENT.createCheckout(order);
    if(pay.ok){ location.href = pay.url; return; }
    if(pay.reason!=="not_configured"){ $("payMsg").textContent="Не удалось создать платёж. Попробуйте ещё раз или выберите оплату наличными."; return; }
    order.status="pending_payment";
    text = "Онлайн-оплата скоро будет доступна. Заказ принят, оплатите "+money(order.total)+" на месте.";
  } else if(type==="terminal") text = "Оплатите "+money(order.total)+" картой через терминал. Официант принесёт его к столу.";
  else text = "Оплатите "+money(order.total)+" наличными при получении.";
  const sent = await ORDERS.submit(order);
  if(!sent.ok){ $("payMsg").textContent="Не удалось отправить заказ. Проверьте соединение и попробуйте ещё раз."; return; }
  order.id = sent.id;
  $("payMsg").textContent="";
  $("cartView").classList.add("hidden"); $("okView").classList.remove("hidden");
  $("okText").textContent = text; $("okId").textContent = "Номер заказа: "+order.id;
}

/* ============ АДМИНКА ============ */
function admRender(){
  $("admName").value = state.cafeName;
  $("admList").innerHTML = state.menu.map(i=>`<div class="adm"><div style="min-width:0"><b>${esc(i.name)}</b><div class="msg">${esc(i.category)} · ${money(i.price)}</div></div>
    <div style="display:flex;gap:6px"><button class="btn sec sm" data-edit="${i.id}">Изм.</button><button class="btn sec sm" data-del="${i.id}">Удал.</button></div></div>`).join("");
}
function openForm(id){
  editId = id; const i = state.menu.find(m=>m.id===id)||{name:"",desc:"",category:"",price:"",img:""};
  $("fName").value=i.name; $("fDesc").value=i.desc; $("fCat").value=i.category; $("fPrice").value=i.price; $("fImg").value=i.img||""; $("fStop").checked=!!i.stop;
  $("admForm").classList.remove("hidden"); $("fName").focus();
}
function adminState(){ $("admLogin").classList.toggle("hidden",isAdmin); $("admMain").classList.toggle("hidden",!isAdmin); $("mode").textContent = isAdmin?"режим админа":""; if(isAdmin) admRender(); }
async function commit(){
  save(); renderCats(); refresh(); admRender();
  if(CONFIG.apiUrl && isAdmin){ $("admMsg").textContent = (await pushRemoteMenu()) ? "Сохранено на сервере" : "Не удалось сохранить на сервере"; }
}

/* ============ СОБЫТИЯ ============ */
document.addEventListener("click", async e=>{
  const t = e.target.closest("button"); if(!t) return;
  if(t.dataset.cat){ cat=t.dataset.cat; renderCats(); renderMenu(); }
  else if(t.dataset.inc) change(+t.dataset.inc,1);
  else if(t.dataset.dec) change(+t.dataset.dec,-1);
  else if(t.dataset.close!==undefined) closeAll();
  else if(t.dataset.copy){ try{ await navigator.clipboard.writeText(t.dataset.copy); toast("Скопировано"); }catch(e){ toast("Не удалось скопировать"); } }
  else if(t.dataset.edit) openForm(+t.dataset.edit);
  else if(t.dataset.del){ if(confirm("Удалить блюдо?")){ state.menu = state.menu.filter(m=>m.id!==+t.dataset.del); cart = cart.filter(c=>c.id!==+t.dataset.del); commit(); } }
});
$("shade").onclick = closeAll;
$("openCart").onclick = ()=>{ if(TABLE && !$("cTable").value) $("cTable").value=TABLE; openSheet("cartSheet"); };
$("payCash").onclick = ()=>placeOrder("cash");
$("newOrder").onclick = ()=>{ cart=[]; $("cartView").classList.remove("hidden"); $("okView").classList.add("hidden"); closeAll(); refresh(); };
$("admBtn").onclick = ()=>{ openSheet("admSheet"); adminState(); };
$("admGo").onclick = async ()=>{
  const p = $("admPass").value; let ok = false;
  if(CONFIG.apiUrl){
    try{ const r = await fetch(CONFIG.apiUrl+"/auth",{method:"POST",headers:{"X-Admin-Password":p}}); ok = r.ok; }
    catch(e){ $("admErr").textContent="Нет связи с сервером"; return; }
  } else ok = (p===CONFIG.demoAdminPassword);
  if(ok){ isAdmin=true; adminPass=p; $("admPass").value=""; $("admErr").textContent=""; adminState(); }
  else $("admErr").textContent="Неверный пароль";
};
$("admOut").onclick = ()=>{ isAdmin=false; adminPass=""; adminState(); closeAll(); };
$("admName").onchange = ()=>{ state.cafeName = $("admName").value.trim()||CONFIG.cafeName; commit(); };
$("pubMenu").onclick = ()=>commit();
$("addDish").onclick = ()=>openForm(null);
$("fCancel").onclick = ()=>$("admForm").classList.add("hidden");
$("fSave").onclick = ()=>{
  const name=$("fName").value.trim(), price=parseFloat($("fPrice").value);
  if(!name || isNaN(price) || price<0){ $("admMsg").textContent="Укажите название и корректную цену"; return; }
  const data={name,desc:$("fDesc").value.trim(),category:$("fCat").value.trim()||"Без категории",price,img:$("fImg").value.trim(),stop:$("fStop").checked};
  if(editId){ Object.assign(state.menu.find(m=>m.id===editId),data); cart.forEach(c=>{ if(c.id===editId) Object.assign(c,data); }); }
  else state.menu.push({id:Date.now(),...data});
  $("admMsg").textContent=""; $("admForm").classList.add("hidden"); commit();
};
$("expJson").onclick = async ()=>{ try{ await navigator.clipboard.writeText(JSON.stringify(state,null,1)); $("admMsg").textContent="JSON скопирован"; }catch(e){ $("admMsg").textContent="Не удалось скопировать"; } };
$("impJson").onclick = ()=>{
  const raw = prompt("Вставьте JSON меню:"); if(!raw) return;
  try{ const s=JSON.parse(raw); if(!Array.isArray(s.menu)) throw 0; state={cafeName:String(s.cafeName||CONFIG.cafeName),menu:s.menu}; cart=[]; commit(); $("admMsg").textContent="Меню загружено"; }
  catch(e){ $("admMsg").textContent="Неверный формат JSON"; }
};

/* ============ ДОПОЛНИТЕЛЬНО ============ */
let toastTimer;
function toast(msg){
  let t = document.getElementById("toast");
  if(!t){ t=document.createElement("div"); t.id="toast"; t.className="toast"; document.body.appendChild(t); }
  t.textContent = msg; t.style.display="block"; clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.style.display="none",2600);
}
const P = CONFIG.place;
const mapQuery = () => encodeURIComponent((state.cafeName+" "+((P.address||"Гомель").replace(/\s*\(.*\)/,""))).trim());
const hasXY = () => typeof P.lat==="number" && typeof P.lng==="number";
const LINKS = {
  yandex:  () => P.yandexOrg || (hasXY() ? `https://yandex.by/maps/?pt=${P.lng},${P.lat}&z=17&l=map` : `https://yandex.by/maps/?text=${mapQuery()}`),
  google:  () => P.googleMaps || `https://www.google.com/maps/search/?api=1&query=${mapQuery()}`,
  gis:     () => P.gisUrl || `https://2gis.by/search/${mapQuery()}`,
  apple:   () => hasXY() ? `https://maps.apple.com/?ll=${P.lat},${P.lng}&q=${encodeURIComponent(state.cafeName)}` : `https://maps.apple.com/?q=${mapQuery()}`,
  yandexRv:() => P.yandexOrg ? P.yandexOrg.replace(/\/?$/,"/")+"reviews/" : LINKS.yandex(),
  googleRv:() => P.googlePlaceId ? `https://search.google.com/local/writereview?placeid=${encodeURIComponent(P.googlePlaceId)}` : LINKS.google(),
  gisRv:   () => P.gisUrl ? P.gisUrl.replace(/\/?$/,"")+"/tab/reviews" : LINKS.gis()
};
function renderInfo(){
  const row = (k,v) => v ? `<div class="irow"><span>${k}</span><span>${v}</span></div>` : "";
  const a = (href,txt) => `<a class="btn sec" href="${esc(href)}" target="_blank" rel="noopener">${txt}</a>`;
  let h = `<h3 style="margin-bottom:6px">${esc(state.cafeName)}</h3>`;
  h += row("Адрес", esc(P.address)) + row("Часы работы", esc(P.hours));
  if(P.phone) h += row("Телефон", `<a href="tel:${esc(P.phone.replace(/[^+0-9]/g,""))}" style="color:var(--acc)">${esc(P.phone)}</a>`);
  if(P.wifiName) h += row("Wi-Fi", `${esc(P.wifiName)}${P.wifiPass?` <button class="btn sec sm" data-copy="${esc(P.wifiPass)}">Пароль</button>`:""}`);
  if(P.tags && P.tags.length) h += `<div class="tags">${P.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join("")}</div>`;
  h += `<div class="ih">Как добраться</div><div class="pay">${a(LINKS.yandex(),"Яндекс Карты")}${a(LINKS.google(),"Google Карты")}${a(LINKS.gis(),"2ГИС")}${a(LINKS.apple(),"Карты Apple")}</div>`;
  h += `<div class="ih">Оставить отзыв</div><div class="payv">${a(LINKS.yandexRv(),"Отзыв в Яндекс Картах")}${a(LINKS.googleRv(),"Отзыв в Google")}${a(LINKS.gisRv(),"Отзыв в 2ГИС")}</div>`;
  const so = P.social || {}; const sl = [["instagram","Instagram"],["vk","ВКонтакте"],["facebook","Facebook"]].filter(x=>so[x[0]]);
  if(sl.length) h += `<div class="ih">Мы в соцсетях</div><div class="pay">${sl.map(x=>a(so[x[0]],x[1])).join("")}</div>`;
  h += `<p class="msg" style="margin-top:14px">Спасибо, что выбрали нас! Ваш отзыв помогает нам становиться лучше.</p>`;
  $("infoBody").innerHTML = h;
}
$("qInfo").onclick = ()=>{ renderInfo(); openSheet("infoSheet"); };
$("q").oninput = renderMenu;

const lastCall = {};
async function callStaff(kind){
  let table = TABLE || $("cTable").value.trim();
  if(!table) table = (prompt("Номер вашего стола?")||"").trim();
  if(!/^[0-9A-Za-zА-Яа-я-]{1,10}$/.test(table)){ toast("Укажите номер стола"); return; }
  if(Date.now()-(lastCall[kind]||0) < 60000){ toast("Запрос уже отправлен, подождите минуту"); return; }
  if(!CONFIG.apiUrl){ toast("Демо-режим: запрос не отправлен"); return; }
  try{
    const r = await fetch(CONFIG.apiUrl+"/call",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({table,kind})});
    if(r.ok){ lastCall[kind]=Date.now(); toast(kind==="bill"?"Официант скоро принесёт счёт":"Официант скоро подойдёт"); }
    else if(r.status===429) toast("Запрос уже отправлен, подождите минуту");
    else toast("Не удалось отправить, попробуйте ещё раз");
  }catch(e){ toast("Нет связи с сервером"); }
}
$("qCall").onclick = ()=>callStaff("waiter");
$("qBill").onclick = ()=>callStaff("bill");
$("payTerminal").onclick = ()=>placeOrder("terminal");

renderCats(); refresh(); loadRemoteMenu();
</script>
</body>
